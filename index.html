<!-- Plitvice is the default sleeve: Matt's favorite of the pressings.
     The others are one click away from it.

     Both targets are ROOT-RELATIVE on purpose. They used to be "plitvice/",
     which is fine at the site root and catastrophic anywhere else: a host that
     falls back to this file for an unknown path re-serves it at that path, the
     relative redirect appends one more segment, and the browser loops until it
     gives up. That is what produced
     /demos/tastemaker/explore/artist/plitvice/plitvice/plitvice/... on the live
     site. The _redirects file generated by hub publish stops the fallback from
     happening for the demos; this stops it being a loop if it ever happens
     again anywhere else. -->
<meta http-equiv="refresh" content="0; url=/plitvice/">
<script>
  // This file is also what the host serves for any path it cannot find, and
  // that fallback is not ours to turn off: as of 20 Sep 2026 every unmatched
  // path on the live site returns this page with a 200, including ones no rule
  // here covers, so something above Pages is catch-all rewriting to /index.html
  // before _redirects is consulted. Until that is undone in the Cloudflare
  // dashboard, a shared link into a demo's client-side route lands here.
  //
  // Recover it rather than dumping the visitor on the front page. The demo's
  // own router cannot read a url it never received, so the deep route is lost
  // either way -- but landing inside the right demo beats landing outside it,
  // and it is the sleeve redirect below that would otherwise append a segment
  // and loop.
  (function () {
    var m = location.pathname.match(/^\/(demos\/[^/]+)\//);
    if (m && location.pathname !== '/' + m[1] + '/') {
      location.replace('/' + m[1] + '/');
      return;
    }
    location.replace('/plitvice/');
  })();
</script>
