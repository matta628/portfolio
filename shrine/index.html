<style>
  :root {
    --ink: #0e1211;
    --paper: #ece7dd;
    --vermilion: #e0533a;
    --gold: #d9b46a;
    --moss: #8d9c7e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); }
  body {
    font: 400 14px/1.45 'Instrument Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* wet cedar and rain light */
    background: radial-gradient(ellipse 100% 70% at 50% 0%, #1a2020 0%, #0e1211 58%, #080b0b 100%);
  }

  #sheet {
    min-height: 100svh;
    display: grid; grid-template-rows: auto 1fr;
    gap: 18px;
    padding: 22px clamp(16px, 3vw, 40px) 34px;
  }

  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
    font: 700 11px/1.5 'Courier Prime', ui-monospace, monospace;
    letter-spacing: .18em; text-transform: uppercase; color: #7d8880;
  }
  header b { color: var(--paper); }
  header .ttl {
    font: italic 400 27px/1 'Instrument Serif', Georgia, serif;
    letter-spacing: 0; text-transform: none; color: var(--paper);
  }
  header .ttl span { font-style: normal; color: var(--vermilion); }
  header .where { margin-left: auto; font-size: 10px; color: #5a6560; }

  #frame {
    display: grid; grid-template-columns: minmax(0, 1fr) 250px;
    align-items: start; justify-items: center;
    gap: clamp(20px, 3vw, 46px);
  }

  /* ---------- the photograph ---------- */
  #stage {
    position: relative;
    margin: 0;            /* <figure> ships with 40px side margins */
    width: min(100%, calc((100svh - 190px) * 400 / 243), 1180px);
    aspect-ratio: 400 / 243;
    box-shadow: 0 26px 60px -18px rgba(0, 0, 0, .85), 0 2px 0 rgba(255, 255, 255, .06) inset;
  }
  #stage > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #stage::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: rgba(8, 12, 11, .38);
    opacity: 0; transition: opacity .45s ease;
  }
  #stage.naming::after, #stage.reading::after { opacity: 1; }

  /* ---------- the sections ---------- */
  .hits { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
  .hits .grab { fill: rgba(255, 255, 255, .001); cursor: pointer; }
  /* A hard gold line right on the section with the light bleeding outward — the
     outline a game puts round a thing you can pick up. The lacquer underneath
     stays, so the tier still warms as well as lights. */
  .hits .lit {
    pointer-events: none;
    fill: var(--vermilion); fill-opacity: .14;
    stroke: var(--gold); stroke-opacity: .85; stroke-width: .55;
    stroke-linejoin: round; stroke-linecap: round;
    opacity: 0;
    /* Soft, not outlined. A hard edge advertises exactly how closely the trace
       follows the roofline, and it never follows it that closely. Blurring the
       stroke into its own glow says "this one" without making a claim about
       where the boundary is. */
    filter: url(#pickup);
    transition: opacity .42s ease;
  }
  .hit.on .lit { opacity: 1; animation: pickup 3s ease-in-out infinite; }
  @keyframes pickup { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .hit.on .lit { animation: none; opacity: 1; }
  }
  .hit.on .grab { fill: rgba(224, 83, 58, .1); }

  /* ---------- the names ---------- */
  .names { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .names .name {
    position: absolute;
    left: var(--x); top: var(--y);
    width: max-content; max-width: min(285px, 40%);
    padding: 8px 13px 9px;
    /* every section is named to the left of the tower, clear of the woodwork */
    transform: translate(calc(-100% - 10px), -50%) translateX(-6px);
    background: rgba(10, 14, 13, .87);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
    box-shadow: 0 10px 26px -10px rgba(0, 0, 0, .85), 0 0 0 1px rgba(217, 180, 106, .22) inset;
    opacity: 0;
    transition: opacity .26s ease, transform .34s cubic-bezier(.2, .7, .2, 1);
  }
  .names .name.on { opacity: 1; transform: translate(calc(-100% - 10px), -50%); }
  .names .name.grabby { pointer-events: auto; }

  .names .name .no { margin: 0; font: 700 9.5px/1 'Courier Prime', monospace; letter-spacing: .2em; color: var(--gold); }
  .names .name .nm { margin: 5px 0 0; font-weight: 600; font-size: 15.5px; }
  .names .name .more {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .42s cubic-bezier(.2, .7, .2, 1);
  }
  .names .name .more > .inner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
  .names .name.open .more { grid-template-rows: 1fr; }
  .names .name .kit { margin: 9px 0 0; font: 400 11px/1.4 'Courier Prime', monospace; letter-spacing: .04em; color: var(--moss); }
  .names .name .blurb { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #d8d1c4; }
  .names .name .blurb + .blurb { margin-top: 7px; }
  .names .name .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .enter {
    display: inline-flex; align-items: center; gap: .5em;
    padding: 9px 13px 8px;
    background: var(--vermilion); color: #fff3ee;
    font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: .03em;
    text-decoration: none; transition: background .2s, transform .2s;
  }
  .enter:hover, .enter:focus-visible { background: #f2664c; transform: translateY(-1px); }
  .enter.ghost { background: none; color: var(--gold); box-shadow: inset 0 0 0 1.5px currentColor; }
  .enter.ghost:hover { background: rgba(217, 180, 106, .14); }

  /* ---------- the tracklist, stacked like the tower ---------- */
  #index { width: 250px; justify-self: stretch; padding-top: 2px; }
  #index h2 {
    margin: 0 0 4px;
    font: 700 10px/1.5 'Courier Prime', monospace; letter-spacing: .2em; text-transform: uppercase; color: #5a6560;
  }
  .tracks { list-style: none; margin: 0; padding: 0; }
  .tracks li { border-bottom: 1px solid rgba(210, 200, 175, .14); }
  .tracks li:first-child { border-top: 1px solid rgba(210, 200, 175, .14); }
  .tracks button {
    display: grid; grid-template-columns: 52px 1fr; align-items: baseline;
    width: 100%; padding: 9px 0 8px;
    border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit;
  }
  .tracks .no { font: 700 10px/1 'Courier Prime', monospace; letter-spacing: .1em; color: #5a6560; }
  .tracks .nm { font-weight: 500; font-size: 14px; transition: color .2s; }
  .tracks .nick { grid-column: 2; font: italic 400 13px/1.3 'Instrument Serif', Georgia, serif; color: #7d8880; }
  .tracks button:hover .nm, .tracks button.on .nm { color: var(--vermilion); }
  .tracks button:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; }
  #index .hint {
    margin: 14px 0 0;
    font: 700 9.5px/1.5 'Courier Prime', monospace; letter-spacing: .15em; text-transform: uppercase; color: #515c57;
  }
  #index .hint .touch { display: none; }
  @media (hover: none) { #index .hint .fine { display: none; } #index .hint .touch { display: inline; } }

  /* the fixed sleeve switcher lives in the top right — keep out of its lane */
  @media (min-width: 861px) { #sheet { padding-right: 176px; } }

  @media (max-width: 860px) {
    #frame { grid-template-columns: 1fr; justify-items: stretch; gap: 20px; }
    #stage { width: 100%; }
    #index { width: auto; }
    header .where { margin-left: 0; width: 100%; }
    .names .name { max-width: 54%; }
    .names .name .nm { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hits .lit, .names .name, .names .name .more, #stage::after { transition-duration: .01s; }
  }

<body data-pressing="shrine">
    <!-- The glow lives in an SVG filter rather than CSS filter functions: Safari
         does not soften SVG strokes through CSS `filter`, so on an iPhone every
         trace came out as a hard drawn line. An SVG filter is scaled with the
         drawing by every engine. Radii are the old CSS ones, halved for
         stdDeviation. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <filter id="pickup" filterUnits="userSpaceOnUse" x="-40" y="-40" width="180" height="400"
                color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation=".34" result="soft"/>
          <feDropShadow in="soft" dx="0" dy="0" stdDeviation="0.55" flood-color="#d9b46a" flood-opacity="0.85" result="near"/>
          <feDropShadow in="near" dx="0" dy="0" stdDeviation="1.7" flood-color="#e0533a" flood-opacity="0.5"/>
        </filter>
      </defs>
    </svg>

<main id="sheet">
  <header>
    <span><b>MA-006</b> · Matt Aguilar</span>
    <span class="ttl"><span>Shrine</span></span>
    <span class="where">Nikkō · May 2026 · read from the top down</span>
  </header>

  <div id="frame">
    <figure id="stage">
      <img src="pagoda.jpg" width="1600" height="972"
           alt="The five-story pagoda at Nikkō in the rain, red and black tiers rising into tall cedars, a stone torii and a moss-covered lantern to the left.">
    </figure>

    <aside id="index">
      <h2>The sections</h2>
      <div id="tracklist"></div>
      <p class="hint"><span class="fine">Hover a section to name it · click for the credit</span><span class="touch">Tap a section for the credit</span></p>
    </aside>
  </div>
</main>
