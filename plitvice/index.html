<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MA-004 · Plitvice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/chrome.css">
<style>
  :root {
    --deep: #06171b;
    --paper: #eaf4f2;
    --spray: #ffffff;
    --pool: #37c2b4;
    --ink: #0a2026;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--deep); color: var(--paper); }
  body {
    font: 400 14px/1.45 'Instrument Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* the deep end of the pool, so the letterboxing isn't just black */
    background:
      radial-gradient(ellipse 90% 70% at 50% 100%, #0d3138 0%, #06171b 62%, #040f12 100%);
  }

  #sheet {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 18px;
    padding: 22px clamp(16px, 3vw, 40px) 34px;
  }

  /* ---------- the slate ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
    font: 700 11px/1.5 'Courier Prime', ui-monospace, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: #6f9aa0;
  }
  header b { color: var(--paper); }
  header .ttl {
    font: italic 400 27px/1 'Instrument Serif', Georgia, serif;
    letter-spacing: 0; text-transform: none; color: var(--paper);
  }
  header .where { margin-left: auto; font-size: 10px; color: #52787e; }

  #frame {
    display: grid; grid-template-columns: minmax(0, 1fr) 250px;
    align-items: start; justify-items: center;
    gap: clamp(20px, 3vw, 46px);
  }

  /* ---------- the photograph ---------- */
  #stage {
    position: relative;
    margin: 0;            /* <figure> ships with 40px side margins */
    width: min(100%, calc((100svh - 190px) * 4 / 3), 1180px);
    aspect-ratio: 4 / 3;
    box-shadow: 0 26px 60px -18px rgba(0, 0, 0, .8), 0 2px 0 rgba(255, 255, 255, .07) inset;
  }
  #stage > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* the water goes quiet while a fall is named */
  #stage::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: rgba(4, 22, 26, .24);
    opacity: 0; transition: opacity .45s ease;
  }
  #stage.naming::after, #stage.reading::after { opacity: 1; }

  /* The falls. Nothing here paints a shape onto the picture: the traced
     polygon is only ever a mask. Hovering lifts the water's own brightness
     behind a heavy blur, so the edges of the trace never show, and hangs a
     drift of spray inside it. */
  .hits { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
  .hits .grab { fill: rgba(255, 255, 255, .001); cursor: pointer; }

  .hits .lit {
    pointer-events: none;
    fill: url(#sheen);
    mix-blend-mode: screen;   /* brighten the water, don't wash white over it */
    filter: url(#soften);     /* feather the trace away entirely */
    opacity: 0;
    transition: opacity .45s ease;
  }
  .hit.on .lit { opacity: 1; }

  .spray { pointer-events: none; opacity: 0; transition: opacity .4s ease; }
  .hit.on .spray { opacity: 1; }
  /* Each glint is a four-pointed star parked by its <g>, so the animation below
     is free to scale and spin it about its own middle. Plain dots vanished into
     white water; a star with points still reads. */
  .glint {
    fill: #fff;
    transform-box: fill-box;
    transform-origin: center;
    filter: drop-shadow(0 0 .22px rgba(224, 248, 255, .9));
    /* every glint keeps its own clock, so the fall never twinkles in unison */
    animation: spray var(--d) ease-in-out var(--t) infinite;
    animation-play-state: paused;
    opacity: 0;
    will-change: transform, opacity;
  }
  .hit.on .glint { animation-play-state: running; }
  @keyframes spray {
    0%   { opacity: 0;             transform: translateY(calc(var(--fall) * -0.30px)) rotate(var(--rot)) scale(0); }
    18%  { opacity: var(--peak);   transform: translateY(calc(var(--fall) * -0.08px)) rotate(var(--rot)) scale(var(--s)); }
    72%  { opacity: calc(var(--peak) * .7); transform: translateY(calc(var(--fall) * 0.55px)) rotate(var(--rot)) scale(calc(var(--s) * .85)); }
    100% { opacity: 0;             transform: translateY(calc(var(--fall) *  1.0px))  rotate(var(--rot)) scale(0); }
  }

  /* ---------- the names ---------- */
  .names { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .names .name {
    position: absolute;
    left: var(--x); top: var(--y);
    width: max-content; max-width: min(300px, 46%);
    padding: 8px 13px 9px;
    transform: translate(-50%, 0) translateY(6px);
    background: rgba(6, 26, 31, .82);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
    box-shadow: 0 10px 26px -10px rgba(0, 0, 0, .8), 0 0 0 1px rgba(160, 226, 220, .22) inset;
    opacity: 0;
    transition: opacity .26s ease, transform .34s cubic-bezier(.2, .7, .2, 1);
  }
  .names .name.side-left { transform: translate(-12%, 0) translateY(6px); }
  .names .name.side-right { transform: translate(-88%, 0) translateY(6px); }
  .names .name.on { opacity: 1; transform: translate(-50%, 0); }
  .names .name.side-left.on { transform: translate(-12%, 0); }
  .names .name.side-right.on { transform: translate(-88%, 0); }
  .names .name.grabby { pointer-events: auto; }

  .names .name .no {
    margin: 0; font: 700 9.5px/1 'Courier Prime', monospace;
    letter-spacing: .2em; color: var(--pool);
  }
  .names .name .nm { margin: 5px 0 0; font-weight: 600; font-size: 15.5px; letter-spacing: .005em; }

  /* the name grows into the credit when you click it */
  .names .name .more {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .42s cubic-bezier(.2, .7, .2, 1);
  }
  .names .name .more > .inner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
  .names .name.open .more { grid-template-rows: 1fr; }
  .names .name .kit {
    margin: 9px 0 0;
    font: 400 11px/1.4 'Courier Prime', monospace; letter-spacing: .04em; color: #7fb8b6;
  }
  .names .name .blurb { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #cfe6e4; }
  .names .name .actions { margin-top: 13px; }
  .enter {
    display: inline-flex; align-items: center; gap: .5em;
    padding: 9px 13px 8px;
    background: var(--pool); color: #04191c;
    font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: .03em;
    text-decoration: none;
    transition: background .2s, transform .2s;
  }
  .enter:hover, .enter:focus-visible { background: #55dccd; transform: translateY(-1px); }
  .enter.ghost { background: none; color: var(--pool); box-shadow: inset 0 0 0 1.5px currentColor; }
  .enter.ghost:hover { background: rgba(55, 194, 180, .14); }

  /* ---------- the tracklist ---------- */
  #index { width: 250px; justify-self: stretch; padding-top: 2px; }
  #index h2 {
    margin: 0 0 4px;
    font: 700 10px/1.5 'Courier Prime', monospace; letter-spacing: .2em; text-transform: uppercase;
    color: #52787e;
  }
  .tracks { list-style: none; margin: 0; padding: 0; }
  .tracks li { border-bottom: 1px solid rgba(120, 180, 180, .17); }
  .tracks li:first-child { border-top: 1px solid rgba(120, 180, 180, .17); }
  .tracks button {
    display: grid; grid-template-columns: 30px 1fr; align-items: baseline;
    width: 100%; padding: 9px 0 8px;
    border: 0; background: none; text-align: left; cursor: pointer;
    font: inherit; color: inherit;
  }
  .tracks .no { font: 700 10px/1 'Courier Prime', monospace; letter-spacing: .1em; color: #52787e; }
  .tracks .nm { font-weight: 500; font-size: 14px; transition: color .2s; }
  .tracks .nick {
    grid-column: 2;
    font: italic 400 13px/1.3 'Instrument Serif', Georgia, serif; color: #6f9aa0;
  }
  .tracks button:hover .nm, .tracks button.on .nm { color: var(--pool); }
  .tracks button:focus-visible { outline: 2px dashed var(--pool); outline-offset: 2px; }
  #index .hint {
    margin: 14px 0 0;
    font: 700 9.5px/1.5 'Courier Prime', monospace; letter-spacing: .15em; text-transform: uppercase;
    color: #46686e;
  }
  #index .hint .touch { display: none; }
  @media (hover: none) {
    #index .hint .fine { display: none; }
    #index .hint .touch { display: inline; }
  }

  /* ---------- phones ---------- */
  /* the fixed sleeve switcher lives in the top right — keep out of its lane */
  @media (min-width: 861px) { #sheet { padding-right: 176px; } }

  @media (max-width: 860px) {
    #frame { grid-template-columns: 1fr; justify-items: stretch; gap: 20px; }
    #stage { width: 100%; }
    #index { width: auto; }
    header .where { margin-left: 0; width: 100%; }
    .names .name { max-width: 62%; font-size: 13px; }
    .names .name .nm { font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hits .lit, .spray, .names .name, .names .name .more, #stage::after { transition-duration: .01s; }
    .glint, .hit.on .glint { animation: none; opacity: .75; transform: scale(var(--s)); }
  }
</style>
</head>
<body data-pressing="plitvice">

<main id="sheet">
  <header>
    <span><b>MA-004</b> · Matt Aguilar</span>
    <span class="ttl">Plitvice</span>
    <span class="where">Plitvička jezera · June 2022 · four projects, five falls, right to left</span>
  </header>

  <div id="frame">
    <figure id="stage">
      <img src="plitvice.jpg" width="1600" height="1200"
           alt="Waterfalls dropping over a mossy limestone ledge into a turquoise pool at Plitvice Lakes, Croatia.">
      <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
          <!-- brightest just under the lip, thinning out as the fall spreads -->
          <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#dff6ff" stop-opacity="0"/>
            <stop offset=".28" stop-color="#ffffff" stop-opacity=".58"/>
            <stop offset=".75" stop-color="#eaf8ff" stop-opacity=".36"/>
            <stop offset="1"   stop-color="#cfeeff" stop-opacity="0"/>
          </linearGradient>
          <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.4"/>
          </filter>
        </defs>
      </svg>
    </figure>

    <aside id="index">
      <h2>The falls</h2>
      <div id="tracklist"></div>
      <p class="hint"><span class="fine">Hover a fall to name it · click for the credit</span><span class="touch">Tap a fall for the credit</span></p>
    </aside>
  </div>
</main>

<script src="../shared/projects.js"></script>
<script src="../shared/hotspots.js"></script>
<script src="../shared/sleeves.js"></script>
<script>
(() => {
  // Every number below is a percentage of the photograph, read straight off it:
  // x across, y down. Each fall is traced as a ribbon — a little wider than the
  // water so it stays easy to hit — from the lip, through the middle, to where
  // it lands in the pool. The trace is never drawn; it only masks the spray and
  // the brightening, so the shape itself stays invisible.
  //
  // Running order is right to left across the picture, opening on the big fall
  // on the right.

  // A fixed shuffle, so the spray sits in the same places on every load and two
  // falls never end up with the same pattern.
  function seeded(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return () => {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return ((h ^= h >>> 16) >>> 0) / 4294967296;
    };
  }

  // Hang a drift of spray inside one fall, clipped to its own trace.
  function spray({ region, group, svg, el, pct }) {
    const clip = `spray-${region.id}`;
    let defs = svg.querySelector('defs');
    if (!defs) svg.insertBefore((defs = el('defs', {})), svg.firstChild);
    const cp = el('clipPath', { id: clip });
    cp.appendChild(el('polygon', { points: region.points.map(([x, y]) => `${x},${pct(y)}`).join(' ') }));
    defs.appendChild(cp);

    const xs = region.points.map((p) => p[0]);
    const ys = region.points.map((p) => pct(p[1]));
    const x0 = Math.min(...xs), w = Math.max(...xs) - x0;
    const y0 = Math.min(...ys), h = Math.max(...ys) - y0;

    const layer = el('g', { class: 'spray', 'clip-path': `url(#${clip})` });
    const rnd = seeded(region.id);
    const STAR = 'M0,-1 Q.13,-.13 1,0 Q.13,.13 0,1 Q-.13,.13 -1,0 Q-.13,-.13 0,-1 Z';
    for (let i = 0; i < 78; i++) {
      // parked a little above the trace, so glints drift in rather than appear
      const at = el('g', {
        transform: `translate(${(x0 + rnd() * w).toFixed(2)} ${(y0 - h * 0.06 + rnd() * h * 1.02).toFixed(2)})`,
      });
      const star = el('path', { class: 'glint', d: STAR });
      star.style.setProperty('--s', (0.10 + rnd() * 0.26).toFixed(3));
      star.style.setProperty('--peak', (0.55 + rnd() * 0.45).toFixed(2));
      star.style.setProperty('--rot', (rnd() * 90).toFixed(1) + 'deg');
      star.style.setProperty('--d', (1.6 + rnd() * 2.8).toFixed(2) + 's');
      star.style.setProperty('--t', (-rnd() * 4.5).toFixed(2) + 's');  // negative: already mid-fall on hover
      star.style.setProperty('--fall', (2.5 + rnd() * 5).toFixed(1));
      at.appendChild(star);
      layer.appendChild(at);
    }
    group.appendChild(layer);
  }

  window.photoSleeve({
    mount: '#stage',
    tracks: '#tracklist',
    photo: [1600, 1200],
    decorate: spray,
    regions: [
      {
        id: 'tastemaker', kind: 'area', nick: 'the big one, far right',
        points: [[75.6, 47], [80.4, 47], [82.0, 58], [85.2, 73], [72.8, 73], [74.2, 58]],
        label: [79, 77],
      },
      {
        // The two middle falls run a couple of meters apart and land in the same
        // spot, so they get one name between them.
        id: 'pedal', kind: 'area', nick: 'the twins, counted as one',
        points: [[54.0, 41.5], [58.2, 41.5], [61.0, 55], [62.6, 69], [52.8, 69], [53.6, 55]],
        label: [57.5, 72.5],
      },
      {
        id: 'jobs', kind: 'area', nick: 'the wide one',
        points: [[32.8, 41], [36.5, 41], [38.6, 54], [41.2, 67.5], [32.6, 67.5], [33.4, 54]],
        label: [37, 71],
      },
      {
        id: 'streeteasy', kind: 'area', nick: 'the tall one, far left',
        points: [[23.5, 37.5], [27.2, 37.5], [26.4, 52], [25.2, 67.5], [20.6, 67.5], [22.2, 52]],
        label: [23, 70.5],
      },
    ],
  });
})();
</script>
</body>
</html>
