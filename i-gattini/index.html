<style>
  :root {
    --dust: #14120f;
    --paper: #f2ece1;
    --sun: #ffcf6b;
    --stone: #a89c8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--dust); color: var(--paper); }
  body {
    font: 400 14px/1.45 'Instrument Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* hot limestone in shade */
    background: radial-gradient(ellipse 90% 70% at 50% 0%, #241f18 0%, #14120f 60%, #0c0b09 100%);
  }

  #sheet {
    min-height: 100svh;
    display: grid; grid-template-rows: auto 1fr;
    gap: 18px;
    padding: 22px clamp(16px, 3vw, 40px) 34px;
  }

  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px;
    font: 700 11px/1.5 'Courier Prime', ui-monospace, monospace;
    letter-spacing: .18em; text-transform: uppercase; color: #8d8474;
  }
  header b { color: var(--paper); }
  header .ttl {
    font: italic 400 27px/1 'Instrument Serif', Georgia, serif;
    letter-spacing: 0; text-transform: none; color: var(--paper);
  }
  header .where { margin-left: auto; font-size: 10px; color: #6a6355; }

  #frame {
    display: grid; grid-template-columns: minmax(0, 1fr) 250px;
    align-items: start; justify-items: center;
    gap: clamp(20px, 3vw, 46px);
  }

  /* ---------- the photograph ---------- */
  #stage {
    position: relative;
    margin: 0;            /* <figure> ships with 40px side margins */
    width: min(100%, calc((100svh - 190px) * 1541 / 869), 1180px);
    aspect-ratio: 1541 / 869;
    box-shadow: 0 26px 60px -18px rgba(0, 0, 0, .85), 0 2px 0 rgba(255, 255, 255, .06) inset;
  }
  #stage > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #stage::after {
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: rgba(12, 10, 8, .46);
    opacity: 0; transition: opacity .45s ease;
  }
  #stage.naming::after, #stage.reading::after { opacity: 1; }

  /* ---------- four cats, outlined ---------- */
  .hits { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
  .hits polygon.grab { fill: rgba(255, 255, 255, .001); cursor: pointer; }
  .hits polygon.lit {
    pointer-events: none;
    /* A halo, not an outline. The cats are already white, so almost nothing goes
       inside and the whole effect is light spilling off the edge — blurred, so
       it never reads as a line drawn around an animal. */
    fill: rgba(255, 240, 210, .08);
    stroke: var(--sun); stroke-opacity: .85; stroke-width: .6;
    stroke-linejoin: round; stroke-linecap: round;
    opacity: 0;
    filter: url(#halo);
    transition: opacity .42s ease;
  }
  .hit.on polygon.lit { opacity: 1; animation: pickup 3s ease-in-out infinite; }
  @keyframes pickup { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .hit.on polygon.lit { animation: none; opacity: 1; }
  }

  /* ---------- the names ---------- */
  .names { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .names .name {
    position: absolute;
    left: var(--x); top: var(--y);
    width: max-content; max-width: min(300px, 33%);
    padding: 8px 13px 9px;
    /* the plaque floats just above the cat's ears */
    transform: translate(-50%, -100%) translateY(-2px);
    background: rgba(16, 13, 10, .88);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
    box-shadow: 0 10px 26px -10px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 207, 107, .22) inset;
    opacity: 0;
    transition: opacity .26s ease, transform .4s cubic-bezier(.2, .7, .2, 1),
                left .42s cubic-bezier(.2, .7, .2, 1), top .42s cubic-bezier(.2, .7, .2, 1);
  }
  .names .name.on { opacity: 1; transform: translate(-50%, -100%) translateY(-10px); }
  .names .name.grabby { pointer-events: auto; }

  /* Every inch of this photograph has a cat or a rock in it, so the opened
     credit slides down out of the way and reads from the corner instead. */
  .names .name.open, .names .name.open.on {
    left: 65%; top: 97%;
    transform: translate(0, -100%);
    max-width: min(310px, 34%);
  }

  .names .name .no { margin: 0; font: 700 9.5px/1 'Courier Prime', monospace; letter-spacing: .2em; color: var(--sun); }
  .names .name .nm { margin: 5px 0 0; font-weight: 600; font-size: 15.5px; }
  .names .name .more {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .42s cubic-bezier(.2, .7, .2, 1);
  }
  .names .name .more > .inner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
  .names .name.open .more { grid-template-rows: 1fr; }
  .names .name .kit { margin: 9px 0 0; font: 400 11px/1.4 'Courier Prime', monospace; letter-spacing: .04em; color: var(--stone); }
  .names .name .blurb { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: #ded6c8; }
  .names .name .blurb + .blurb { margin-top: 7px; }
  .names .name .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .enter {
    display: inline-flex; align-items: center; gap: .5em;
    padding: 9px 13px 8px;
    background: var(--sun); color: #241a06;
    font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: .03em;
    text-decoration: none; transition: background .2s, transform .2s;
  }
  .enter:hover, .enter:focus-visible { background: #ffdf9a; transform: translateY(-1px); }
  .enter.ghost { background: none; color: var(--sun); box-shadow: inset 0 0 0 1.5px currentColor; }
  .enter.ghost:hover { background: rgba(255, 207, 107, .14); }

  /* ---------- the tracklist ---------- */
  #index { width: 250px; justify-self: stretch; padding-top: 2px; }
  #index h2 {
    margin: 0 0 4px;
    font: 700 10px/1.5 'Courier Prime', monospace; letter-spacing: .2em; text-transform: uppercase; color: #6a6355;
  }
  .tracks { list-style: none; margin: 0; padding: 0; }
  .tracks li { border-bottom: 1px solid rgba(220, 205, 180, .15); }
  .tracks li:first-child { border-top: 1px solid rgba(220, 205, 180, .15); }
  .tracks button {
    display: grid; grid-template-columns: 30px 1fr; align-items: baseline;
    width: 100%; padding: 9px 0 8px;
    border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit;
  }
  .tracks .no { font: 700 10px/1 'Courier Prime', monospace; letter-spacing: .1em; color: #6a6355; }
  .tracks .nm { font-weight: 500; font-size: 14px; transition: color .2s; }
  .tracks .nick { grid-column: 2; font: italic 400 13px/1.3 'Instrument Serif', Georgia, serif; color: #8d8474; }
  .tracks button:hover .nm, .tracks button.on .nm { color: var(--sun); }
  .tracks button:focus-visible { outline: 2px dashed var(--sun); outline-offset: 2px; }
  #index .hint {
    margin: 14px 0 0;
    font: 700 9.5px/1.5 'Courier Prime', monospace; letter-spacing: .15em; text-transform: uppercase; color: #5c5648;
  }
  #index .hint .touch { display: none; }
  @media (hover: none) { #index .hint .fine { display: none; } #index .hint .touch { display: inline; } }

  /* the fixed sleeve switcher lives in the top right — keep out of its lane */
  @media (min-width: 861px) { #sheet { padding-right: 176px; } }

  @media (max-width: 860px) {
    #frame { grid-template-columns: 1fr; justify-items: stretch; gap: 20px; }
    #stage { width: 100%; }
    #index { width: auto; }
    header .where { margin-left: 0; width: 100%; }
    .names .name { max-width: 54%; }
    .names .name.open, .names .name.open.on { left: 50%; transform: translate(-50%, -100%); max-width: 84%; }
    .names .name .nm { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hits polygon.lit, .names .name, .names .name .more, #stage::after { transition-duration: .01s; }
  }
</style>

<body data-pressing="i-gattini">
    <!-- The glow lives in an SVG filter rather than CSS filter functions: Safari
         does not soften SVG strokes through CSS `filter`, so on an iPhone every
         trace came out as a hard drawn line. An SVG filter is scaled with the
         drawing by every engine. Radii are the old CSS ones, halved for
         stdDeviation. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <filter id="halo" filterUnits="userSpaceOnUse" x="-40" y="-40" width="180" height="400"
                color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation=".38" result="soft"/>
          <feDropShadow in="soft" dx="0" dy="0" stdDeviation="0.6" flood-color="#ffcf6b" flood-opacity="0.9" result="near"/>
          <feDropShadow in="near" dx="0" dy="0" stdDeviation="1.9" flood-color="#ffba4a" flood-opacity="0.55"/>
        </filter>
      </defs>
    </svg>

<main id="sheet">
  <header>
    <span><b>MA-007</b> · Matt Aguilar</span>
    <span class="ttl">I Gattini</span>
    <span class="where">Amalfi coast · four of them · one tin of tuna · no fixed address</span>
  </header>

  <div id="frame">
    <figure id="stage">
      <img src="gattini.jpg" width="1541" height="869"
           alt="Four white stray kittens in a gap in a limestone wall on the Amalfi coast: two sitting in front, one half-hidden behind, and one standing on a plank with its mouth open.">
    </figure>

    <aside id="index">
      <h2>The litter</h2>
      <div id="tracklist"></div>
      <p class="hint"><span class="fine">Hover a cat to name it · click for the credit</span><span class="touch">Tap a cat for the credit</span></p>
    </aside>
  </div>
</main>
